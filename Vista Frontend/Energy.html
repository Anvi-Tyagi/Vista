<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AOI Selection | Vista</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Leaflet Draw -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw/dist/leaflet.draw.css"/>
  <script src="https://unpkg.com/leaflet-draw/dist/leaflet.draw.js"></script>

  <style>
    #map { height: 60vh; width: 100%; margin-top: 20px; border-radius: 10px; }
    .log-box { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 8px; min-height: 120px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center">🌍 Select Your Area of Interest</h2>
    <div id="map"></div>

    <div class="log-box" id="log">📌 Draw a rectangle on the map to fetch and process data.</div>
  </div>

  <script>
    // Init map centered on India
    var map = L.map('map').setView([22.5, 78.9], 5);

    // Tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Draw controls
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    var drawControl = new L.Control.Draw({
      draw: { polygon: false, circle: false, marker: false, polyline: false },
      edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    // Handle draw event
    map.on(L.Draw.Event.CREATED, function (e) {
      let layer = e.layer;
      drawnItems.clearLayers(); // remove previous AOI
      drawnItems.addLayer(layer);

      let bounds = layer.getBounds();
      let bbox = [
        bounds.getWest(),
        bounds.getSouth(),
        bounds.getEast(),
        bounds.getNorth()
      ];

      document.getElementById("log").innerHTML = "⏳ Running pipeline for selected AOI...";

      fetch("http://127.0.0.1:5001/run_pipeline", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ region: "CustomAOI", bbox: bbox })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          let html = `<b>✅ Pipeline completed for ${data.region}</b><br>`;

          // Show values
          if (data.ndvi) html += `<p><b>NDVI:</b> ${data.ndvi}</p>`;
          if (data.pest) html += `<p><b>Pest Risk:</b> ${data.pest}</p>`;
          if (data.crop_health) html += `<p><b>Crop Health:</b> ${data.crop_health}</p>`;

          // Show images
          if (data.files && data.files.ndvi) {
            html += `<img src="http://127.0.0.1:5001/static/${data.region}/ndvi.jpg" width="300" class="m-2">`;
          }
          if (data.files && data.files.pest_map) {
            html += `<img src="http://127.0.0.1:5001/static/${data.region}/pest_map.png" width="300" class="m-2">`;
          }

          // CSV link
          if (data.files && data.files.crop_health) {
            html += `<p><a href="http://127.0.0.1:5001/static/${data.region}/crop_health.csv" target="_blank">📄 Download Crop Health CSV</a></p>`;
          }

          document.getElementById("log").innerHTML = html;
        } else {
          document.getElementById("log").innerHTML = "❌ Error: " + data.error;
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById("log").innerHTML = "⚠️ Backend not reachable.";
      });
    });
  </script>
</body>
</html>
